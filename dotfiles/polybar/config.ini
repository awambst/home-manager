[bar/main]
background=#BB1e1e2e
bottom=true
font-0=DejaVu Sans:size=10;2
font-1=Font Awesome 6 Free:style=Solid:size=12;3
font-2=Font Awesome 6 Free:style=Solid:size=16;3
font-3=Symbols Nerd Font Mono:style=Solid:size=16;3
foreground=#FFcdd6f4
height=30
module-margin=1
modules-center=date
modules-left=powermenu i3 cpu memory filesystem
modules-right=microphone volume network wifi battery tray
padding-left=1
padding-right=2
width=100%

[module/battery]
adapter=AC
battery=BAT0
format-charging=<label-charging>
format-charging-prefix=" "
format-charging-prefix-font=2
format-discharging=<label-discharging>
format-discharging-prefix=" "
format-discharging-prefix-font=2
format-full-prefix=" "
format-full-prefix-font=2
full-at=99
label-charging="%percentage%%  "
label-discharging="%percentage%%  "
label-full="100%  "
type=internal/battery

[module/cpu]
format-prefix=" "
format-prefix-font=2
interval=2
label=%percentage:2%% 
type=internal/cpu

[module/date]
date=%d/%m/%Y
interval=1
label=" %date%  %time%"
time=%H:%M:%S
type=internal/date

[module/filesystem]
format-mounted-prefix=" "
format-mounted-prefix-font=2
interval=30
label-mounted="%percentage_used%%  "
mount-0=/
type=internal/fs

[module/i3]
format=<label-state> <label-mode>
label-focused=%index%
label-focused-background=#89b4fa
label-focused-foreground=#1e1e2e
label-focused-padding=2
label-unfocused=%index%
label-unfocused-padding=2
label-urgent=%index%
label-urgent-background=#f38ba8
label-urgent-padding=2
label-visible=%index%
label-visible-padding=2
type=internal/i3

[module/memory]
format-prefix=" "
format-prefix-font=2
interval=2
label="%percentage_used%%  "
type=internal/memory

[module/microphone]
click-left=pactl set-source-mute @DEFAULT_SOURCE@ toggle
click-right=pavucontrol --tab=4 &
exec=~/.config/polybar/mic_script.sh
scroll-down=pactl set-source-volume @DEFAULT_SOURCE@ -5%
scroll-up=pactl set-source-volume @DEFAULT_SOURCE@ +5%
tail=true
type=custom/script

[module/network]
format-connected=<label-connected> 
format-connected-prefix=" "
format-connected-prefix-font=2
format-disconnected=<label-disconnected> 
format-disconnected-prefix=" "
format-disconnected-prefix-font=2
interface-type=wired
interval=3
label-connected=%linkspeed%
label-disconnected=X
label-disconnected-foreground=#f38ba8
type=internal/network

[module/powermenu]
click-left=~/.config/i3/powermenu.sh
content="  "
content-font=4
content-foreground=#7EB1EF
type=custom/text

[module/tray]
tray-detached=false
tray-maxsize=24
tray-offset-x=0
tray-offset-y=0
tray-padding=2
tray-position=right
type=internal/tray

[module/volume]
click-right=pavucontrol
format-muted=<label-muted>
format-muted-prefix=" "
format-muted-prefix-font=2
format-volume=<label-volume> 
format-volume-prefix=" "
format-volume-prefix-font=2
label-muted=
label-muted-foreground=#f38ba8
label-volume=%percentage%%
type=internal/pulseaudio

[module/wifi]
format-connected=<label-connected> 
format-connected-prefix=" "
format-connected-prefix-font=2
format-disconnected=<label-disconnected> 
format-disconnected-prefix=" "
format-disconnected-prefix-font=2
interface-type=wireless
interval=3
label-connected=%essid% - %signal%
label-disconnected=X
label-disconnected-foreground=#f38ba8
type=internal/network



