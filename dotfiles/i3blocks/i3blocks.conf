# i3blocks configuration file
#
# The i3blocks man page describes the usage of the binary,
# and its website describes the configuration:
#
#     https://vivien.github.io/i3blocks


# Global properties
separator=true
separator_block_width=15

[battery]
label=  
command=printf "%.3f\n" $(echo "scale=5; ($(cat /sys/class/power_supply/BAT0/charge_now)/1000) / ($(cat /sys/class/power_supply/BAT0/charge_full) /1000) * 100" | bc )
color=#81b71a
interval=3


[volume]
command=wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{print int($2*100)}'
label= 
#LABEL=VOL 
interval=1
signal=10
#STEP=5%
MIXER=default
#SCONTROL=[determined automatically]
#NATURAL_MAPPING=0

[mic]
command=wpctl get-volume @DEFAULT_AUDIO_SOURCE@ | awk '{print int($2*100)}'
label=
#LABEL=VOL 
interval=1
signal=10
#STEP=5%
MIXER=default
#SCONTROL=[determined automatically]
#NATURAL_MAPPING=0


#[documentation]
#full_text=Documentation
#website=https://vivien.github.io/i3blocks
#command=xdg-open "$website"
#color=#f12711

[disk]
command=/home/$USER/.config/scripts/disk
LABEL= 
#DIR=$HOME
#ALERT_LOW=10
interval=30

[memory]
command=free -h | awk '/Mem:/ {print $3 " / " $2}'
label= 
interval=30

#[greetings]
#color=#f5af19
#command=echo "Hello, $USER!"
#interval=once

[time]
command=date '+%Y-%m-%d %H:%M:%S'
interval=1
